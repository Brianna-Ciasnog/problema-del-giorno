name: Daily Problem

on:
  schedule:
    - cron: "0 8 * * 1-5"
  workflow_dispatch:
  
jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
      - run: node services/notification.js